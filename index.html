<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة فحص الأرقام</title><style>
:root{font-family:Tahoma,system-ui,sans-serif;color:#213647;background:#edf4f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#d8eae8,transparent 45%),radial-gradient(circle at 90% 90%,#e3e5f2,transparent 50%),#f3f7f8}.shell{width:min(960px,100%);display:grid;grid-template-columns:1fr 1.1fr;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 24px 80px #153e4912}.intro{padding:60px 40px;background:linear-gradient(145deg,#164d59,#237f82);color:white;display:flex;flex-direction:column;justify-content:center}.mark{width:64px;height:64px;border:1px solid #ffffff55;border-radius:20px;display:grid;place-items:center;font-size:26px;margin-bottom:36px;background:#ffffff12}.intro h1{font-size:32px;line-height:1.6;margin:0 0 16px}.intro p{line-height:1.9;color:#d9eeee}.tag{font-size:12px;letter-spacing:2px;color:#c6e8e6;margin-bottom:16px}.panel{padding:48px}.panel h2{margin:0 0 12px;font-size:27px}.muted{color:#74858d;font-size:14px;line-height:1.8}label{display:block;margin:24px 0 10px;font-size:14px}input{width:100%;border:1px solid #dbe4e8;border-radius:12px;padding:15px;font:inherit;background:#f9fbfc;color:#243b45;outline:none}input:focus{border-color:#258183;box-shadow:0 0 0 3px #25818315}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:15px;background:#207679;color:#fff;width:100%;margin-top:24px}button:hover{background:#185f62}button:disabled{opacity:.6;cursor:wait}.secondary{background:#edf5f5;color:#256567;margin-top:12px}.secondary:hover{background:#dcecec}.danger{background:#fff0f0;color:#a64242}.danger:hover{background:#ffe3e3}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.top button{width:auto;margin:0;padding:10px 16px;font-size:13px}.badge{display:inline-block;padding:6px 10px;background:#e7f5f1;color:#287267;border-radius:20px;font-size:12px;margin-top:8px}.result{padding:14px;border-radius:12px;background:#edf6f6;margin-top:18px;line-height:1.7;font-size:14px}.result.error{background:#fff0f0;color:#a64242}[hidden]{display:none!important}.admin{margin-top:28px;border-top:1px solid #e6edef;padding-top:20px}.admin h3{margin:0}.actions{display:flex;gap:12px}.actions button{flex:1}.foot{font-size:12px;color:#97a5ad;text-align:center;margin-top:30px}@media(max-width:650px){.shell{display:block}.intro{padding:28px}.intro h1{font-size:24px}.intro p,.mark{display:none}.tag{margin:0 0 8px}.panel{padding:28px}.actions{display:block}}
</style></head><body><main class="shell"><aside class="intro"><div class="mark">ID</div><div class="tag">ID CHECK</div><h1>أهلاً في بوابتك<br>لفحص الأرقام</h1><p>سجّل دخولك وافحص الأرقام الموجودة في قاعدة البيانات من مكان واحد.</p></aside><section class="panel"><div id="loginView"><h2>تسجيل الدخول</h2><p class="muted">أدخل بيانات حسابك للمتابعة</p><form id="loginForm"><label for="username">اسم المستخدم</label><input id="username" dir="ltr" autocomplete="username" placeholder="اسم حسابك" required maxlength="64"><label for="password">كلمة المرور</label><input id="password" dir="ltr" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required maxlength="256"><button id="loginButton">دخول إلى حسابك</button></form><div id="loginResult" class="result error" role="alert" hidden></div><p class="foot">بوابة فحص الأرقام</p></div><div id="dashboard" hidden><div class="top"><div><span id="welcome"></span><br><span id="role" class="badge"></span></div><button class="secondary" id="logout">خروج</button></div><h2>فحص ID</h2><p class="muted">أدخل الرقم لمعرفة إذا كان موجوداً في قاعدة البيانات.</p><form id="checkForm"><label for="record">الرقم</label><input id="record" dir="ltr" placeholder="مثال 00123" required pattern="[A-Za-z0-9_-]{1,64}" maxlength="64"><button>فحص الرقم</button></form><div id="result" class="result" role="status" hidden></div><div id="admin" class="admin" hidden><h3>إدارة الأرقام</h3><p class="muted">أضف أو احذف الرقم الذي أدخلته في الحقل أعلاه.</p><div class="actions"><button class="secondary" id="add">إضافة الرقم</button><button class="danger" id="remove">حذف الرقم</button></div></div></div></section></main><script>
const $=id=>document.getElementById(id);
function message(id,text,error=false){const el=$(id);el.textContent=text;el.hidden=false;el.classList.toggle('error',error)}
function showUser(user){$('loginView').hidden=!!user;$('dashboard').hidden=!user;$('admin').hidden=!user||user.role!=='admin';if(user){$('welcome').textContent='أهلاً، '+user.username;$('role').textContent=user.role==='admin'?'حساب أدمن':'حساب مستخدم'}else{$('password').value='';$('record').value='';$('result').hidden=true}}
async function api(path,method='GET',data){const response=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const result=await response.json();if(!response.ok){if(response.status===401&&path!=='/api/login')showUser(null);throw new Error(result.error||'تعذر تنفيذ الطلب')}return result}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginButton').disabled=true;$('loginResult').hidden=true;try{const user=await api('/api/login','POST',{username:$('username').value.trim(),password:$('password').value});$('password').value='';showUser(user)}catch(e){message('loginResult',e.message,true)}finally{$('loginButton').disabled=false}};
async function recordAction(path,method){if(!$('record').reportValidity())return;const buttons=[...$('dashboard').querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{const data=await api(path,method,{id:$('record').value});message('result','exists'in data?(data.exists?'الرقم موجود في قاعدة البيانات':'الرقم غير موجود في قاعدة البيانات'):data.saved?'تم حفظ الرقم في قاعدة البيانات':'تم حذف الرقم من قاعدة البيانات')}catch(e){message('result',e.message,true)}finally{buttons.forEach(b=>b.disabled=false)}}
$('checkForm').onsubmit=e=>{e.preventDefault();recordAction('/api/check','POST')};$('add').onclick=()=>recordAction('/api/records','POST');$('remove').onclick=()=>{if($('record').reportValidity()&&confirm('هل تريد حذف الرقم '+$('record').value+'؟'))recordAction('/api/records','DELETE')};$('logout').onclick=async()=>{try{await api('/api/logout','POST');showUser(null)}catch(e){message('result',e.message,true)}};api('/api/me').then(showUser).catch(()=>showUser(null));
</script></body></html>
