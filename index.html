<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص ID</title><style>body{font-family:system-ui;background:#eef3f7;color:#172c40;max-width:560px;margin:60px auto;padding:20px}main{background:white;border-radius:20px;padding:30px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border:1px solid #c4ced8;border-radius:8px;font:inherit}button{background:#146b85;color:white;cursor:pointer}pre{white-space:pre-wrap;direction:ltr;text-align:left}small{display:block;color:#546576}</style><main><h1>فحص ID</h1><p>أدخل الرقم لتعرف إذا كان موجوداً في قاعدة البيانات.</p><input id="record" placeholder="مثال 00123" maxlength="64" dir="ltr"><button onclick="send('/api/check','POST')">فحص الرقم</button><pre id="result" aria-live="polite"></pre><hr><h2>إدارة الأرقام</h2><small>كلمة سر الإدارة لإضافة أو حذف الرقم الموجود في الحقل.</small><input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off"><button onclick="send('/api/records','POST')">إضافة الرقم</button><button onclick="send('/api/records','DELETE')">حذف الرقم</button></main><script>async function send(path,method){const out=document.getElementById('result');out.textContent='جارٍ التنفيذ';try{const headers={'Content-Type':'application/json'};if(path.includes('records'))headers.Authorization='Bearer '+document.getElementById('token').value;const response=await fetch(path,{method,headers,body:JSON.stringify({id:document.getElementById('record').value.trim()})});const data=await response.json();out.textContent=response.ok?('exists' in data?(data.exists?'الرقم موجود':'الرقم غير موجود'):JSON.stringify(data,null,2)):JSON.stringify(data,null,2)}catch(e){out.textContent='تعذر الاتصال بالخدمة'}}</script></html>
